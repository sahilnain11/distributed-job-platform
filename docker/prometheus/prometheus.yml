global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: job-platform
    metrics_path: /actuator/prometheus
    scrape_timeout: 4s
    static_configs:
      - targets: [host.docker.internal:8080]
  - job_name: rabbitmq
    scrape_timeout: 4s
    static_configs:
      - targets: [rabbitmq:15692]