name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21, real dependencies, and tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Select Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Check tools and Docker
        run: |
          java -version
          mvn -version
          python --version
          docker info
          docker compose version

      - name: Check public repository contents and documentation links
        run: python tools/check_repository.py

      - name: Test benchmark, scaling, and container tooling without live load
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Validate Compose definitions
        run: |
          docker compose --profile monitoring config --quiet
          docker compose -f compose.workers.yaml config --quiet

      - name: Verify Java with real PostgreSQL and RabbitMQ
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify disposable two-worker container deployment
        run: python tools/container_smoke.py

      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/container-smoke/
          if-no-files-found: ignore
          retention-days: 7